<!DOCTYPE html>
<html>
    <head>
        <title>stelore calis</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body style="color: white; font-family:Arial; font-size:30px; text-align:center">
        <div id="content"></div>
        <nav>
            <div class="logo">STELORE</div>
            <ul>
                <li><a href="https://stelore-calisthenics.vercel.app/home.html">HOME</a></li>
            </ul>
        </nav>
        <h1 id="title">Hello everyone</h1>
        <p style="font-size:30px; color: #ffffff8d">this is stelore calisthenics team website</p>
        <script>
            document.getElementById("title").style.opacity = 0;
            setTimeout(() => {
                document.getElementById("title").style.transition = "1s";
                document.getElementById("title").style.opacity = 1;
            }, 500);
            document.addEventListener("DOMContentLoaded", () => {
                document.body.classList.add("loaded");
            });
            document.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", function(e) {
                    if (this.href && this.target !== "_blank") {
                        e.preventDefault();
                        document.body.classList.remove("loaded");
                        setTimeout(() => {
                            window.location = this.href;
                        }, 300);
                    }
                });
            });
        </script>
    </body>
</html>
